name: Chinese RST Sphinx validation
on:
  push:
    branches: [learning-edition-zh]
    paths:
      - 'docs/user/running_zh.rst'
      - '.github/workflows/zh-rst-check.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "sphinx<7" sphinx-rtd-theme recommonmark
      - name: Build docs
        run: sphinx-build -b html -n docs /tmp/spinningup-docs
