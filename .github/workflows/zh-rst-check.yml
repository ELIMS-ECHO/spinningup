name: Chinese RST Sphinx validation
on:
  push:
    branches: [learning-edition-zh]
    paths:
      - 'docs/user/running_zh.rst'
      - 'docs/user/saving_and_loading_zh.rst'
      - 'docs/user/plotting_zh.rst'
      - 'docs/spinningup/spinningup_zh.rst'
      - 'docs/spinningup/keypapers_zh.rst'
      - 'docs/spinningup/exercises_zh.rst'
      - 'docs/spinningup/bench_zh.rst'
      - 'docs/utils/logger_zh.rst'
      - 'spinup/utils/logx.py'
      - 'spinup/utils/mpi_tools.py'
      - 'spinup/utils/serialization_utils.py'
      - 'docs/images/plots/**'
      - '.github/workflows/zh-rst-check.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Sphinx
        run: |
          python -m pip install "sphinx>=6,<7"
      - name: Build Chinese RST pages in isolation
        run: |
          set -eu
          src=/tmp/spinningup-zh-rst
          mkdir -p "$src"
          cp docs/user/running_zh.rst "$src/"
          cp docs/user/saving_and_loading_zh.rst "$src/"
          cp docs/user/plotting_zh.rst "$src/"
          cp docs/spinningup/spinningup_zh.rst "$src/"
          cp docs/spinningup/keypapers_zh.rst "$src/"
          cp docs/spinningup/exercises_zh.rst "$src/"
          cp docs/spinningup/bench_zh.rst "$src/"
          cp docs/utils/logger_zh.rst "$src/"
          # Use the actual logx.py source for autodoc, but isolate spinup.__init__
          # to avoid importing the entire historic TF1 and PyTorch algorithm stack.
          api=/tmp/spinningup-zh-api
          mkdir -p "$api/spinup/utils"
          touch "$api/spinup/__init__.py" "$api/spinup/utils/__init__.py"
          cp spinup/utils/logx.py "$api/spinup/utils/logx.py"
          cp spinup/utils/mpi_tools.py "$api/spinup/utils/mpi_tools.py"
          cp spinup/utils/serialization_utils.py "$api/spinup/utils/serialization_utils.py"
          # Original figure paths are ../images/plots relative to the source RST.
          mkdir -p /tmp/images/plots/pyt /tmp/images/plots/tf1
          cp docs/images/plots/pyt/*_performance.svg /tmp/images/plots/pyt/
          cp docs/images/plots/tf1/*_performance.svg /tmp/images/plots/tf1/
          cat > "$src/conf.py" <<'PYCONF'
          project = 'Spinning Up Chinese Documentation Check'
          master_doc = 'index'
          language = 'zh_CN'
          import sys
          sys.path.insert(0, '/tmp/spinningup-zh-api')
          extensions = ['sphinx.ext.autodoc']
          autodoc_mock_imports = ['tensorflow', 'torch', 'numpy', 'joblib', 'mpi4py']
          # The original researcher guide contains 47 numbered bibliography footnotes
          # that are intentionally not cited using [n]_ in the prose.
          suppress_warnings = ['ref.footnote']
          show_warning_types = True
          PYCONF
          cat > "$src/index.rst" <<'RSTINDEX'
          中文文档构建检查
          ================

          .. toctree::
             :maxdepth: 1

             running_zh
             saving_and_loading_zh
             plotting_zh
             spinningup_zh
             keypapers_zh
             exercises_zh
             bench_zh
             logger_zh
          RSTINDEX
          sphinx-build -b html -n -W --keep-going "$src" /tmp/spinningup-zh-html
          # Assert that autodoc really rendered docstrings from logx.py,
          # not just empty stub API headings.
          grep -Fq 'A general-purpose logger.' /tmp/spinningup-zh-html/logger_zh.html
          grep -Fq 'A variant of Logger tailored for tracking average values over epochs.' /tmp/spinningup-zh-html/logger_zh.html
          grep -Fq 'Loads graphs saved by Logger.' /tmp/spinningup-zh-html/logger_zh.html
