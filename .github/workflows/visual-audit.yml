name: Verify GitHub rendered textbook pages
on:
  push:
    branches: [learning-edition-zh]
    paths:
      - 'scripts/visual_audit.py'
      - '.github/workflows/visual-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fonts for Chinese screenshot fidelity
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
          fc-match :lang=zh-cn
      - name: Install browser automation
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install chromium
      - name: Check public GitHub page rendering and capture screenshots
        run: python scripts/visual_audit.py
      - name: Upload screenshots and DOM report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-render-verification
          path: dist/github-visual-audit/
          if-no-files-found: warn
